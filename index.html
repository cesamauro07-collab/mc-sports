<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Sports</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f4f4;
    color:#111;
}

header{
    background:#050505;
    color:white;
    padding:18px;
}

.topo{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:900;
}

.slogan{
    color:#aaa;
    font-size:13px;
    margin-top:4px;
}

.carrinho-btn{
    background:white;
    color:#000;
    border:0;
    padding:11px 15px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.hero{
    background:#111;
    color:white;
    text-align:center;
    padding:55px 20px;
}

.hero h1{
    font-size:36px;
    margin-bottom:10px;
}

.hero p{
    color:#ccc;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:0 18px;
}

.produtos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.produto{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 3px 12px #0001;
}

.galeria{
    position:relative;
    height:300px;
    background:#eee;
    overflow:hidden;
}

.galeria img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.galeria img.ativa{
    display:block;
}

.seta{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:#ffffffdd;
    color:#000;
    font-size:20px;
    cursor:pointer;
    z-index:2;
}

.esquerda{
    left:10px;
}

.direita{
    right:10px;
}

.sem-foto{
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#777;
    font-weight:bold;
}

.info{
    padding:16px;
}

.info h2{
    font-size:20px;
}

.tamanho{
    color:#777;
    margin:7px 0;
}

.preco{
    font-size:22px;
    font-weight:bold;
    margin:12px 0;
}

.adicionar{
    width:100%;
    padding:13px;
    background:#000;
    color:white;
    border:0;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.adicionar:hover{
    background:#222;
}

.carrinho{
    position:fixed;
    right:0;
    top:0;
    width:min(420px,100%);
    height:100%;
    background:white;
    z-index:20;
    padding:22px;
    overflow-y:auto;
    box-shadow:-5px 0 20px #0003;
    display:none;
}

.carrinho.aberto{
    display:block;
}

.fechar{
    float:right;
    border:0;
    background:#eee;
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
}

.item{
    padding:16px 0;
    border-bottom:1px solid #eee;
}

.quantidade{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
}

.quantidade button{
    width:30px;
    height:30px;
    border:1px solid #ddd;
    background:white;
    border-radius:5px;
}

.total{
    font-size:22px;
    font-weight:bold;
    margin:25px 0;
}

.whatsapp{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#25D366;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.continuar{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    background:white;
    color:#111;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.continuar:hover{
    background:#f2f2f2;
}

.vazio{
    text-align:center;
    color:#777;
    margin-top:40px;
}

footer{
    text-align:center;
    padding:40px 20px;
    color:#777;
}

@media(max-width:500px){
    .hero h1{
        font-size:28px;
    }
}
</style>
</head>

<body>

<header>

<div class="topo">

<div>
<div class="logo">MC SPORTS</div>
<div class="slogan">A loja do seu time</div>
</div>

<button class="carrinho-btn" onclick="abrirCarrinho()">
Carrinho (<span id="contador">0</span>)
</button>

</div>

</header>

<section class="hero">

<h1>MC Sports</h1>

<p>A loja do seu time</p>

</section>

<main class="container">

<div class="produtos" id="produtos"></div>

</main>

<div class="carrinho" id="carrinho">

<button class="fechar" onclick="fecharCarrinho()">
Fechar
</button>

<h2>Seu carrinho</h2>

<div id="itens"></div>

<div class="total">
Total: R$ <span id="total">0,00</span>
</div>

<button class="whatsapp" onclick="finalizarPedido()">
Finalizar pedido pelo WhatsApp
</button>

<button class="continuar" onclick="fecharCarrinho()">
Continuar comprando
</button>

</div>

<footer>

MC Sports — A loja do seu time

</footer>

<script>

const numeroWhatsApp = "5592994486162";

const produtos = [

{
id:1,
time:"Chelsea",
nome:"Camisa Chelsea 26/27 — Principal",
tamanho:"G",
preco:60,
fotos:[
"chelsea2.jpg",
"chelsea.jpg"
]
},

{
id:2,
time:"Corinthians",
nome:"Camisa Corinthians 2026 — Torcedor",
tamanho:"M",
preco:60,
fotos:[
"Corinthians.jpg",
"Corinthians2.jpg"
]
},

{
id:3,
time:"Flamengo",
nome:"Camisa Flamengo 2026 — Principal",
tamanho:"M",
preco:60,
fotos:[
"Flamengo.jpg",
"Flamengo2.jpg"
]
},

{
id:4,
time:"Milan",
nome:"Camisa Milan 2025 — Principal",
tamanho:"M",
preco:60,
fotos:[
"Milan.jpg",
"Milan2.jpg"
]
}

];

let carrinho=[];

function dinheiro(valor){

return valor.toLocaleString("pt-BR",{
minimumFractionDigits:2
});

}

function mostrarProdutos(){

const area=document.getElementById("produtos");

area.innerHTML="";

produtos.forEach(produto=>{

let galeria="";

if(produto.fotos.length>0){

galeria=`

<div class="galeria">

${produto.fotos.map((foto,index)=>`

<img
src="${foto}"
class="${index===0 ? "ativa" : ""}"
alt="${produto.nome}"
>

`).join("")}

${produto.fotos.length>1 ? `

<button
class="seta esquerda"
onclick="mudarFoto(this,-1)">
‹
</button>

<button
class="seta direita"
onclick="mudarFoto(this,1)">
›
</button>

` : ""}

</div>

`;

}else{

galeria=`

<div class="galeria">

<div class="sem-foto">
FOTO DA CAMISA
</div>

</div>

`;

}

area.innerHTML+=`

<div class="produto">

${galeria}

<div class="info">

<h2>${produto.nome}</h2>

<div class="tamanho">
Tamanho disponível: <strong>${produto.tamanho}</strong>
</div>

<div class="preco">
R$ ${dinheiro(produto.preco)}
</div>

<button
class="adicionar"
onclick="adicionar(${produto.id})">

Adicionar ao carrinho

</button>

</div>

</div>

`;

});

}

function mudarFoto(botao,direcao){

const galeria=botao.parentElement;

const fotos=galeria.querySelectorAll("img");

let atual=0;

fotos.forEach((foto,index)=>{

if(foto.classList.contains("ativa")){
atual=index;
}

});

fotos[atual].classList.remove("ativa");

let nova=atual+direcao;

if(nova<0){
nova=fotos.length-1;
}

if(nova>=fotos.length){
nova=0;
}

fotos[nova].classList.add("ativa");

}

function adicionar(id){

const existente=
carrinho.find(item=>item.id===id);

if(existente){

existente.quantidade++;

}else{

carrinho.push({
id:id,
quantidade:1
});

}

atualizarCarrinho();

abrirCarrinho();

}

function atualizarCarrinho(){

const area=document.getElementById("itens");

area.innerHTML="";

let total=0;
let quantidadeTotal=0;

if(carrinho.length===0){

area.innerHTML=
'<div class="vazio">Seu carrinho está vazio.</div>';

}

carrinho.forEach(item=>{

const produto=
produtos.find(p=>p.id===item.id);

const subtotal=
produto.preco*item.quantidade;

total+=subtotal;

quantidadeTotal+=item.quantidade;

area.innerHTML+=`

<div class="item">

<strong>
${produto.nome}
</strong>

<br>

<small>
Tamanho ${produto.tamanho}
</small>

<div class="quantidade">

<button onclick="alterarQuantidade(${item.id},-1)">
-
</button>

<span>
${item.quantidade}
</span>

<button onclick="alterarQuantidade(${item.id},1)">
+
</button>

<span>
R$ ${dinheiro(subtotal)}
</span>

</div>

</div>

`;

});

document.getElementById("total").innerText=
dinheiro(total);

document.getElementById("contador").innerText=
quantidadeTotal;

}

function alterarQuantidade(id,valor){

const item=
carrinho.find(i=>i.id===id);

if(!item)return;

item.quantidade+=valor;

if(item.quantidade<=0){

carrinho=
carrinho.filter(i=>i.id!==id);

}

atualizarCarrinho();

}

function abrirCarrinho(){

document
.getElementById("carrinho")
.classList.add("aberto");

}

function fecharCarrinho(){

document
.getElementById("carrinho")
.classList.remove("aberto");

}

function finalizarPedido(){

if(carrinho.length===0){

alert("Seu carrinho está vazio.");

return;

}

let mensagem=
"Olá! Quero fazer um pedido na MC Sports:%0A%0A";

let total=0;

carrinho.forEach(item=>{

const produto=
produtos.find(p=>p.id===item.id);

const subtotal=
produto.preco*item.quantidade;

total+=subtotal;

mensagem+=
`${item.quantidade}x ${produto.nome} - Tamanho ${produto.tamanho} - R$ ${dinheiro(subtotal)}%0A`;

});

mensagem+=
`%0ATotal: R$ ${dinheiro(total)}%0A%0A`;

mensagem+=
"Gostaria de confirmar a disponibilidade e combinar a entrega.";

window.open(
"https://wa.me/"+
numeroWhatsApp+
"?text="+
mensagem,
"_blank"
);

}

mostrarProdutos();
atualizarCarrinho();

</script>

</body>
</html>
