<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MC Sports</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#7a1230;
    color:#111;
}

/* =========================
   TOPO
========================= */

header{
    background:#004d98;
    color:white;
    padding:16px 18px;
    position:sticky;
    top:0;
    z-index:100;
}

.topo{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo-topo{
    font-size:28px;
    font-weight:900;
    font-style:italic;
    letter-spacing:-2px;
}

.slogan{
    color:#dcecff;
    font-size:12px;
    margin-top:3px;
}

/* =========================
   CARRINHO
========================= */

.carrinho-btn{
    position:relative;
    background:transparent;
    border:0;
    width:48px;
    height:48px;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
}

.icone-carrinho{
    width:31px;
    height:31px;
    fill:#ffd400;
}

.contador{
    position:absolute;
    top:-2px;
    right:-4px;
    min-width:22px;
    height:22px;
    padding:0 5px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ff8c00;
    color:white;
    border-radius:50%;
    border:2px solid #004d98;
    font-size:12px;
    font-weight:900;
}

/* =========================
   PÁGINAS
========================= */

.pagina{
    display:none;
}

.pagina.ativa{
    display:block;
}

/* =========================
   INÍCIO
========================= */

.inicio{
    min-height:calc(100vh - 77px);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px 20px;

    background:
    linear-gradient(
        135deg,
        #004d98 0%,
        #004d98 43%,
        #7a1230 43%,
        #7a1230 100%
    );
}

/* =========================
   LOGO
========================= */

.logo-principal{
    width:170px;
    height:190px;
    margin:0 auto 24px;
    position:relative;
    filter:drop-shadow(0 10px 18px #0006);
}

.escudo-externo{
    position:absolute;
    inset:0;
    background:#7a1230;

    clip-path:polygon(
        7% 4%,
        93% 4%,
        93% 60%,
        88% 73%,
        78% 85%,
        50% 99%,
        22% 85%,
        12% 73%,
        7% 60%
    );
}

.escudo-interno{
    position:absolute;
    inset:7px;
    background:#004d98;

    clip-path:polygon(
        7% 4%,
        93% 4%,
        93% 60%,
        88% 73%,
        78% 85%,
        50% 99%,
        22% 85%,
        12% 73%,
        7% 60%
    );
}

.logo-linha{
    position:absolute;
    width:112px;
    height:4px;
    background:white;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.logo-mc{
    position:absolute;
    z-index:2;
    top:65px;
    left:50%;
    transform:translateX(-50%) skew(-8deg);
    color:white;
    font-size:60px;
    font-weight:1000;
    font-style:italic;
    letter-spacing:-9px;
    text-shadow:
    3px 3px 0 #7a1230,
    -1px -1px 0 #fff;
}

.logo-sports{
    position:absolute;
    z-index:3;
    bottom:31px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:14px;
    font-weight:900;
    letter-spacing:4px;
    white-space:nowrap;
}

.logo-ano{
    position:absolute;
    z-index:3;
    top:27px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:9px;
    font-weight:bold;
    letter-spacing:2px;
    white-space:nowrap;
}

.inicio h1{
    color:white;
    font-size:53px;
    font-weight:900;
    font-style:italic;
    letter-spacing:-4px;
    text-shadow:3px 4px 0 #7a1230;
}

.inicio p{
    color:#eee;
    font-size:17px;
    margin:8px 0 28px;
}

/* =========================
   BOTÕES
========================= */

.botoes-inicio{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:min(300px,100%);
    margin:auto;
}

.botao-camisas,
.botao-whatsapp{
    border:0;
    padding:15px 20px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.botao-camisas{
    background:white;
    color:#004d98;
}

.botao-whatsapp{
    background:#25D366;
    color:white;
}

/* =========================
   PRODUTOS
========================= */

.produtos-area{
    background:#7a1230;
    min-height:calc(100vh - 77px);
    padding:30px 0 55px;
}

.barra-produtos{
    max-width:1100px;
    margin:0 auto 25px;
    padding:0 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.titulo-produtos{
    color:white;
    font-size:30px;
    font-weight:900;
}

.voltar{
    background:white;
    color:#004d98;
    border:0;
    padding:10px 15px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:0 18px;
}

.produtos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:24px;
}

/* =========================
   PRODUTO
========================= */

.produto{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 5px 18px #0003;
}

.galeria{
    position:relative;
    height:340px;
    background:#eee;
    overflow:hidden;
}

/* IMPORTANTE:
   cursor indica que a foto pode ser ampliada */

.galeria img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    cursor:zoom-in;
}

.galeria img.ativa{
    display:block;
}

.seta{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#ffffffdd;
    color:#000;
    font-size:22px;
    cursor:pointer;
    z-index:2;
}

.esquerda{
    left:10px;
}

.direita{
    right:10px;
}

/* =========================
   INFORMAÇÕES
========================= */

.info{
    padding:18px;
}

.info h2{
    font-size:19px;
    line-height:1.3;
    margin-bottom:8px;
}

.tamanho-label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-top:12px;
    margin-bottom:6px;
}

.seletor-tamanho{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    border-radius:8px;
    background:white;
    color:#111;
    font-size:15px;
    font-weight:bold;
}

.preco{
    font-size:24px;
    font-weight:bold;
    margin:14px 0;
}

.adicionar{
    width:100%;
    padding:14px;
    background:#004d98;
    color:white;
    border:0;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

/* =========================
   VISUALIZADOR DE FOTO
========================= */

.visualizador{
    position:fixed;
    inset:0;
    background:#000e;
    z-index:1000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.visualizador.aberto{
    display:flex;
}

.visualizador-conteudo{
    position:relative;
    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;
}

.visualizador img{
    max-width:90%;
    max-height:90%;

    width:auto;
    height:auto;

    object-fit:contain;

    border-radius:8px;

    box-shadow:
    0 10px 40px #0008;
}

/* BOTÃO FECHAR */

.fechar-foto{
    position:absolute;
    top:15px;
    right:15px;

    width:45px;
    height:45px;

    border:0;
    border-radius:50%;

    background:#ffffffdd;
    color:#111;

    font-size:28px;
    line-height:1;

    cursor:pointer;

    z-index:3;
}

/* SETAS DA FOTO GRANDE */

.seta-foto{
    position:absolute;

    top:50%;
    transform:translateY(-50%);

    width:50px;
    height:50px;

    border:0;
    border-radius:50%;

    background:#ffffffdd;

    color:#111;

    font-size:32px;

    cursor:pointer;

    z-index:3;
}

.seta-foto.esquerda-foto{
    left:15px;
}

.seta-foto.direita-foto{
    right:15px;
}

/* =========================
   CARRINHO
========================= */

.carrinho{
    position:fixed;
    right:0;
    top:0;
    width:min(420px,100%);
    height:100%;
    background:white;
    z-index:200;
    padding:22px;
    overflow-y:auto;
    box-shadow:-5px 0 20px #0003;
    display:none;
}

.carrinho.aberto{
    display:block;
}

.fechar{
    float:right;
    border:0;
    background:#eee;
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
}

/* =========================
   EXCLUIR TUDO
========================= */

.excluir-tudo{
    width:100%;
    margin-top:15px;
    padding:11px;
    border:1px solid #ddd;
    border-radius:9px;
    background:white;
    color:#c40000;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.excluir-tudo:hover{
    background:#fff4f4;
}

/* =========================
   ITENS DO CARRINHO
========================= */

.item{
    position:relative;
    overflow:hidden;
    padding:16px 0;
    border-bottom:1px solid #eee;
}

.item-conteudo{
    position:relative;
    z-index:2;
    background:white;
    transform:translateX(0);
    transition:transform .25s ease;
}

.item-excluir{
    position:absolute;
    top:0;
    right:0;
    width:82px;
    height:100%;
    border:0;
    background:#d00000;
    color:white;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:1;
}

.icone-lixeira{
    width:27px;
    height:27px;
    fill:white;
}

.item-produto{
    display:flex;
    gap:12px;
    align-items:center;
}

.item-produto img{
    width:75px;
    height:75px;
    object-fit:cover;
    border-radius:8px;
    background:#eee;
}

.item-info{
    flex:1;
}

.item-tamanho{
    margin-top:5px;
    color:#777;
    font-size:14px;
}

.quantidade{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
}

.quantidade button{
    width:30px;
    height:30px;
    border:1px solid #ddd;
    background:white;
    border-radius:5px;
    cursor:pointer;
}

.total{
    font-size:22px;
    font-weight:bold;
    margin:25px 0;
}

.whatsapp{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#25D366;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.continuar{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    background:white;
    color:#111;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   CONFIRMAÇÃO
========================= */

.confirmacao{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:#111;
    color:white;
    padding:12px 18px;
    border-radius:9px;
    font-size:14px;
    font-weight:bold;
    z-index:9999;
    white-space:nowrap;
}

/* =========================
   RODAPÉ
========================= */

footer{
    text-align:center;
    padding:35px 20px;
    background:#050505;
    color:#aaa;
}

/* =========================
   CELULAR
========================= */

@media(max-width:500px){

    .inicio h1{
        font-size:43px;
    }

    .logo-principal{
        width:145px;
        height:165px;
    }

    .logo-mc{
        font-size:50px;
        top:57px;
    }

    .logo-sports{
        bottom:27px;
        font-size:12px;
    }

    .titulo-produtos{
        font-size:25px;
    }

    .produtos{
        grid-template-columns:1fr 1fr;
        gap:12px;
    }

    .galeria{
        height:260px;
    }

    .info{
        padding:13px;
    }

    .info h2{
        font-size:16px;
    }

    .preco{
        font-size:20px;
    }

    .adicionar{
        padding:11px;
        font-size:13px;
    }

    /* FOTO GRANDE NO CELULAR */

    .visualizador{
        padding:10px;
    }

    .visualizador img{
        max-width:96%;
        max-height:85%;
    }

    .seta-foto{
        width:42px;
        height:42px;
        font-size:27px;
    }

    .seta-foto.esquerda-foto{
        left:8px;
    }

    .seta-foto.direita-foto{
        right:8px;
    }

}

</style>

</head>

/* =========================
   TROCAR FOTO NA GALERIA
========================= */

function mudarFoto(
    galeria,
    direcao
){

    const fotos =
    galeria.querySelectorAll("img");


    if(fotos.length <= 1){
        return;
    }


    let atual = 0;


    fotos.forEach(
    function(foto,index){

        if(
            foto.classList.contains("ativa")
        ){

            atual = index;

        }

    });


    fotos[atual]
    .classList
    .remove("ativa");


    let nova =
    atual + direcao;


    if(nova < 0){

        nova =
        fotos.length - 1;

    }


    if(nova >= fotos.length){

        nova = 0;

    }


    fotos[nova]
    .classList
    .add("ativa");

}


/* =========================
   ABRIR FOTO AMPLIADA
========================= */

function abrirVisualizador(
    fotos,
    indice,
    nome
){

    if(fotos.length === 0){
        return;
    }

    fotosVisualizador =
    fotos.slice();

    indiceFotoVisualizador =
    indice;


    atualizarFotoAmpliada(
        nome
    );


    document
    .getElementById("visualizador")
    .classList
    .add("aberto");


    document.body.style.overflow =
    "hidden";

}


/* =========================
   ATUALIZAR FOTO AMPLIADA
========================= */

function atualizarFotoAmpliada(
    nome
){

    const imagem =
    document.getElementById(
        "fotoAmpliada"
    );


    imagem.src =
    fotosVisualizador[
        indiceFotoVisualizador
    ];


    imagem.alt =
    nome;

}


/* =========================
   FOTO ANTERIOR
========================= */

function fotoAnterior(){

    if(
        fotosVisualizador.length === 0
    ){
        return;
    }


    indiceFotoVisualizador--;


    if(
        indiceFotoVisualizador < 0
    ){

        indiceFotoVisualizador =
        fotosVisualizador.length - 1;

    }


    atualizarFotoAmpliada(
        document.getElementById(
            "fotoAmpliada"
        ).alt
    );

}


/* =========================
   PRÓXIMA FOTO
========================= */

function proximaFoto(){

    if(
        fotosVisualizador.length === 0
    ){
        return;
    }


    indiceFotoVisualizador++;


    if(
        indiceFotoVisualizador >=
        fotosVisualizador.length
    ){

        indiceFotoVisualizador = 0;

    }


    atualizarFotoAmpliada(
        document.getElementById(
            "fotoAmpliada"
        ).alt
    );

}


/* =========================
   FECHAR FOTO
========================= */

function fecharFoto(){

    document
    .getElementById("visualizador")
    .classList
    .remove("aberto");


    document.body.style.overflow =
    "";

}


/* =========================
   CARRINHO
========================= */

function adicionar(
    id,
    tamanho,
    galeria
){

    const produto =
    produtos.find(
        function(p){

            return p.id === id;

        }
    );


    if(!produto){
        return;
    }


    const existente =
    carrinho.find(
        function(item){

            return (
                item.id === id &&
                item.tamanho === tamanho
            );

        }
    );


    if(existente){

        existente.quantidade++;

    }else{

        carrinho.push({

            id:id,
            tamanho:tamanho,
            quantidade:1

        });

    }


    atualizarCarrinho();


    /* ANIMAÇÃO */

    const imagem =
    galeria.querySelector(
        "img.ativa"
    );


    const carrinhoBtn =
    document.getElementById(
        "botaoCarrinho"
    );


    if(imagem){

        const clone =
        imagem.cloneNode(true);

        const inicio =
        imagem.getBoundingClientRect();

        const destino =
        carrinhoBtn.getBoundingClientRect();


        clone.style.position =
        "fixed";

        clone.style.left =
        inicio.left + "px";

        clone.style.top =
        inicio.top + "px";

        clone.style.width =
        "70px";

        clone.style.height =
        "70px";

        clone.style.objectFit =
        "cover";

        clone.style.zIndex =
        "9999";

        clone.style.borderRadius =
        "10px";

        clone.style.pointerEvents =
        "none";

        clone.style.transition =
        "all .6s ease";


        document.body.appendChild(
            clone
        );


        requestAnimationFrame(
        function(){

            clone.style.left =
            (
                destino.left +
                destino.width / 2 -
                20
            ) + "px";


            clone.style.top =
            (
                destino.top +
                destino.height / 2 -
                20
            ) + "px";


            clone.style.width =
            "30px";

            clone.style.height =
            "30px";

            clone.style.opacity =
            "0";

        });


        setTimeout(
        function(){

            clone.remove();

        },650);

    }


    mostrarConfirmacao(
        produto.time +
        " — tamanho " +
        tamanho +
        " adicionado ao carrinho"
    );

}

/* =========================
   EXCLUIR ITEM
========================= */

function excluirItem(
    id,
    tamanho
){

    carrinho =
    carrinho.filter(
        function(item){

            return !(
                item.id === id &&
                item.tamanho === tamanho
            );

        }
    );


    atualizarCarrinho();

}


/* =========================
   EXCLUIR TUDO
========================= */

function excluirTudo(){

    if(carrinho.length === 0){
        return;
    }


    const confirmar =
    confirm(
        "Deseja excluir todos os itens do carrinho?"
    );


    if(!confirmar){
        return;
    }


    carrinho = [];


    atualizarCarrinho();

}


/* =========================
   DESLIZAR ITEM PARA EXCLUIR
========================= */

function ativarSwipe(
    itemDiv,
    conteudo
){

    let inicioX = 0;
    let inicioY = 0;
    let movimentoX = 0;
    let arrastando = false;


    itemDiv.addEventListener(
        "touchstart",
        function(event){

            if(event.touches.length !== 1){
                return;
            }


            inicioX =
            event.touches[0].clientX;

            inicioY =
            event.touches[0].clientY;

            movimentoX = 0;

            arrastando = false;

            conteudo.style.transition =
            "none";

        },
        {
            passive:true
        }
    );


    itemDiv.addEventListener(
        "touchmove",
        function(event){

            if(
                inicioX === 0 ||
                event.touches.length !== 1
            ){
                return;
            }


            const atualX =
            event.touches[0].clientX;

            const atualY =
            event.touches[0].clientY;


            const diferencaX =
            atualX - inicioX;

            const diferencaY =
            atualY - inicioY;


            if(
                Math.abs(diferencaY) >
                Math.abs(diferencaX)
            ){

                return;

            }


            if(diferencaX < 0){

                movimentoX =
                Math.max(
                    diferencaX,
                    -82
                );

                arrastando = true;


                conteudo.style.transform =
                "translateX(" +
                movimentoX +
                "px)";


                event.preventDefault();

            }

        },
        {
            passive:false
        }
    );


    itemDiv.addEventListener(
        "touchend",
        function(){

            if(!arrastando){
                return;
            }


            conteudo.style.transition =
            "transform .25s ease";


            if(movimentoX <= -40){

                conteudo.style.transform =
                "translateX(-82px)";

            }else{

                conteudo.style.transform =
                "translateX(0)";

            }


            inicioX = 0;
            inicioY = 0;
            movimentoX = 0;
            arrastando = false;

        }
    );

}


/* =========================
   ATUALIZAR CARRINHO
========================= */

function atualizarCarrinho(){

    const area =
    document.getElementById("itens");

    const contador =
    document.getElementById("contador");

    const totalElemento =
    document.getElementById("total");


    area.innerHTML = "";


    let total = 0;

    let quantidadeTotal = 0;


    if(carrinho.length === 0){

        area.innerHTML =
        '<div style="text-align:center;color:#777;margin-top:40px;">Seu carrinho está vazio.</div>';

    }


    carrinho.forEach(
    function(item){

        const produto =
        produtos.find(
            function(p){

                return p.id === item.id;

            }
        );


        if(!produto){
            return;
        }


        const subtotal =
        produto.preco *
        item.quantidade;


        total += subtotal;

        quantidadeTotal +=
        item.quantidade;


        const itemDiv =
        document.createElement("div");

        itemDiv.className =
        "item";


        /* CONTEÚDO DO ITEM */

        const conteudo =
        document.createElement("div");

        conteudo.className =
        "item-conteudo";


        const itemProduto =
        document.createElement("div");

        itemProduto.className =
        "item-produto";


        /* FOTO */

        if(produto.fotos.length > 0){

            const imagem =
            document.createElement("img");

            imagem.src =
            produto.fotos[0];

            imagem.alt =
            produto.nome;

            itemProduto.appendChild(
                imagem
            );

        }else{

            const imagemVazia =
            document.createElement("div");

            imagemVazia.style.width =
            "75px";

            imagemVazia.style.height =
            "75px";

            imagemVazia.style.borderRadius =
            "8px";

            imagemVazia.style.background =
            "#eee";

            imagemVazia.style.flexShrink =
            "0";

            itemProduto.appendChild(
                imagemVazia
            );

        }


        const itemInfo =
        document.createElement("div");

        itemInfo.className =
        "item-info";


        itemInfo.innerHTML = `

            <strong>
                ${produto.nome}
            </strong>

            <div class="item-tamanho">

                Tamanho:
                <strong>
                    ${item.tamanho}
                </strong>

            </div>

            <div class="quantidade">

                <button
                type="button"
                class="menos">

                -

                </button>

                <span>
                    ${item.quantidade}
                </span>

                <button
                type="button"
                class="mais">

                +

                </button>

                <span>
                    R$ ${dinheiro(subtotal)}
                </span>

            </div>

        `;


        itemProduto.appendChild(
            itemInfo
        );


        conteudo.appendChild(
            itemProduto
        );


        /* BOTÃO DA LIXEIRA */

        const excluirBtn =
        document.createElement("button");

        excluirBtn.className =
        "item-excluir";

        excluirBtn.type =
        "button";

        excluirBtn.setAttribute(
            "aria-label",
            "Excluir item"
        );


        excluirBtn.innerHTML = `

            <svg
            class="icone-lixeira"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg">

                <path d="M6 7h12v13H6V7zm3-4h6l1 2h4v2H4V5h4l1-2zm1 7v7h2v-7h-2zm4 0v7h2v-7h-2z"/>

            </svg>

        `;


        excluirBtn.addEventListener(
            "click",
            function(){

                excluirItem(
                    item.id,
                    item.tamanho
                );

            }
        );


        itemDiv.appendChild(
            conteudo
        );

        itemDiv.appendChild(
            excluirBtn
        );


        /* BOTÃO MENOS */

        itemInfo
        .querySelector(".menos")
        .addEventListener(
            "click",
            function(){

                alterarQuantidade(
                    item.id,
                    item.tamanho,
                    -1
                );

            }
        );


        /* BOTÃO MAIS */

        itemInfo
        .querySelector(".mais")
        .addEventListener(
            "click",
            function(){

                alterarQuantidade(
                    item.id,
                    item.tamanho,
                    1
                );

            }
        );


        /* SWIPE */

        ativarSwipe(
            itemDiv,
            conteudo
        );


        area.appendChild(
            itemDiv
        );

    });


    contador.textContent =
    quantidadeTotal;


    totalElemento.textContent =
    dinheiro(total);

}


/* =========================
   ALTERAR QUANTIDADE
========================= */

function alterarQuantidade(
    id,
    tamanho,
    valor
){

    const item =
    carrinho.find(
        function(i){

            return (
                i.id === id &&
                i.tamanho === tamanho
            );

        }
    );


    if(!item){
        return;
    }


    item.quantidade +=
    valor;


    if(item.quantidade <= 0){

        carrinho =
        carrinho.filter(
            function(i){

                return !(
                    i.id === id &&
                    i.tamanho === tamanho
                );

            }
        );

    }


    atualizarCarrinho();

}

   ABRIR / FECHAR CARRINHO
========================= */

    .classList

    document

    .classList

}


/* =========================
   FINALIZAR PEDIDO
========================= */

function finalizarPedido(){

    if(carrinho.length === 0){

        alert(
            "Seu carrinho está vazio."
        );

        return;

    }


    let mensagem =
    "MC SPORTS - NOVO PEDIDO\n\n";


    mensagem +=
    "DADOS DE ENTREGA\n";

    mensagem +=
    "Nome:\n";

    mensagem +=
    "Bairro:\n";

    mensagem +=
    "Rua:\n";

    mensagem +=
    "Número da casa:\n\n";


    mensagem +=
    "PEDIDO\n";


    let total = 0;


    carrinho.forEach(
    function(item){

        const produto =
        produtos.find(
            function(p){

                return p.id === item.id;

            }
        );


        const subtotal =
        produto.preco *
        item.quantidade;


        total += subtotal;


        mensagem +=
        item.quantidade +
        "x " +
        produto.nome +
        "\n";


        mensagem +=
        "Tamanho: " +
        item.tamanho +
        "\n";


        mensagem +=
        "Subtotal: R$ " +
        dinheiro(subtotal) +
        "\n\n";

    });


    mensagem +=
    "TOTAL: R$ " +
    dinheiro(total);


    const url =
    "https://wa.me/" +
    numeroWhatsApp +
    "?text=" +
    encodeURIComponent(
        mensagem
    );


    window.location.href =
    url;

}

            event.target ===
            document.getElementById(
                "visualizador"
            )
        ){

        }

    }
);


/* TECLADO */

document.addEventListener(
"keydown",
function(event){

    const visualizador =
    document.getElementById(
        "visualizador"
    );


    if(
        !visualizador.classList.contains(
            "aberto"
        )
    ){

        return;

    }


    if(event.key === "Escape"){

        fecharFoto();

    }


    if(event.key === "ArrowLeft"){

        fotoAnterior();

    }


    if(event.key === "ArrowRight"){

        proximaFoto();

    }

});
