<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MC SPORTS</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #7a1230;
    color: white;
}


/* =========================
   CABEÇALHO
========================= */

header {
    background: #004d98;
    padding: 15px 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.slogan {
    font-size: 12px;
    margin-top: 3px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.cart-button {
    background: none;
    border: none;
    color: white;

    font-size: 26px;

    cursor: pointer;

    position: relative;
}

.cart-counter {
    position: absolute;

    top: -8px;
    right: -10px;

    background: #ffcc00;
    color: #000;

    border-radius: 50%;

    width: 20px;
    height: 20px;

    font-size: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;
}


/* =========================
   GERAL
========================= */

.container {
    width: 92%;
    max-width: 1100px;

    margin: auto;
}


/* =========================
   PÁGINA INICIAL
========================= */

.home {
    text-align: center;

    padding: 70px 20px;
}

.home h1 {
    font-size: 42px;

    margin-bottom: 10px;
}

.home p {
    font-size: 18px;

    margin-bottom: 30px;
}

.button {
    background: #004d98;

    color: white;

    border: none;

    padding: 14px 25px;

    border-radius: 8px;

    font-size: 16px;

    cursor: pointer;

    margin: 5px;
}

.button:hover {
    opacity: 0.9;
}


/* =========================
   CATÁLOGO
========================= */

.catalogo {
    display: none;

    padding: 30px 0 60px;
}

.catalogo h2 {
    text-align: center;

    margin-bottom: 25px;
}

.produtos {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));

    gap: 20px;
}


/* =========================
   CARD
========================= */

.card {

    background: white;

    color: #222;

    border-radius: 12px;

    padding: 15px;

    box-shadow:
        0 4px 10px rgba(0,0,0,0.25);
}


/* =========================
   FOTOS
========================= */

.fotos {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 8px;

    margin-bottom: 15px;
}

.foto {

    width: 100%;

    height: 220px;

    object-fit: cover;

    border-radius: 8px;

    cursor: pointer;

    background: #eee;
}


/* ESPAÇO PARA FOTO */

.placeholder {

    width: 100%;

    height: 220px;

    background: #eee;

    color: #777;

    border-radius: 8px;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    font-size: 15px;
}


/* =========================
   INFORMAÇÕES DO PRODUTO
========================= */

.card h3 {

    font-size: 17px;

    margin-bottom: 10px;
}

.preco {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 12px;
}


/* =========================
   TAMANHO
========================= */

select {

    width: 100%;

    padding: 10px;

    border-radius: 6px;

    border: 1px solid #ccc;

    margin-bottom: 10px;
}


/* =========================
   ADICIONAR CARRINHO
========================= */

.add-cart {

    width: 100%;

    background: #004d98;

    color: white;

    border: none;

    padding: 12px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 15px;
}

.add-cart:hover {
    opacity: 0.9;
}


/* =========================
   VOLTAR
========================= */

.voltar {

    margin-bottom: 20px;
}


/* =========================
   CARRINHO
========================= */

.cart-panel {

    display: none;

    position: fixed;

    top: 0;
    right: 0;

    width: 92%;

    max-width: 420px;

    height: 100vh;

    background: white;

    color: #222;

    z-index: 200;

    padding: 20px;

    overflow-y: auto;

    box-shadow:
        -5px 0 15px rgba(0,0,0,0.3);
}

.cart-panel h2 {

    margin-bottom: 15px;
}

.fechar-carrinho {

    float: right;

    background: none;

    border: none;

    font-size: 25px;

    cursor: pointer;
}


/* =========================
   EXCLUIR TUDO
========================= */

.excluir-tudo {

    width: 100%;

    padding: 12px;

    margin-bottom: 15px;

    background: #d11a2a;

    color: white;

    border: none;

    border-radius: 7px;

    font-size: 15px;

    cursor: pointer;
}

.excluir-tudo:hover {
    opacity: 0.9;
}


/* =========================
   ITEM DO CARRINHO
========================= */

.swipe-container {

    position: relative;

    overflow: hidden;

    margin-bottom: 10px;

    border-radius: 8px;
}


/* LIXEIRA */

.lixeira {

    position: absolute;

    right: 0;
    top: 0;

    width: 80px;
    height: 100%;

    background: #d11a2a;

    color: white;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 24px;
}


/* ITEM */

.swipe-item {

    position: relative;

    background: white;

    z-index: 2;

    transition:
        transform 0.25s ease;

    touch-action: pan-y;
}

.cart-item {

    border-bottom:
        1px solid #ddd;

    padding: 12px 0;
}

.cart-item h3 {

    font-size: 16px;

    margin-bottom: 8px;
}

.quantidade {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-top: 8px;
}

.quantidade button {

    width: 30px;

    height: 30px;

    border: none;

    background: #004d98;

    color: white;

    border-radius: 5px;

    cursor: pointer;
}


/* =========================
   TOTAL
========================= */

.total {

    font-size: 20px;

    font-weight: bold;

    margin: 20px 0;
}


/* =========================
   ENTREGA
========================= */

.entrega {

    margin-top: 20px;
}

.entrega h3 {

    margin-bottom: 10px;
}

.entrega input {

    width: 100%;

    padding: 11px;

    margin-bottom: 10px;

    border:
        1px solid #ccc;

    border-radius: 6px;
}


/* =========================
   WHATSAPP
========================= */

.whatsapp-finalizar {

    width: 100%;

    background: #25D366;

    color: white;

    border: none;

    padding: 14px;

    border-radius: 8px;

    font-size: 16px;

    cursor: pointer;
}


/* =========================
   MODAL DAS FOTOS
========================= */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.95);

    z-index: 500;

    align-items: center;

    justify-content: center;
}

.modal img {

    max-width: 90%;

    max-height: 85%;

    object-fit: contain;
}

.fechar-modal {

    position: absolute;

    top: 20px;
    right: 25px;

    color: white;

    font-size: 35px;

    background: none;

    border: none;

    cursor: pointer;
}

.seta {

    position: absolute;

    top: 50%;

    transform:
        translateY(-50%);

    background:
        rgba(255,255,255,0.2);

    color: white;

    border: none;

    font-size: 35px;

    width: 50px;

    height: 60px;

    cursor: pointer;

    border-radius: 8px;
}

.seta-esquerda {
    left: 15px;
}

.seta-direita {
    right: 15px;
}


/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .home h1 {
        font-size: 34px;
    }

    .produtos {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;
    }

    .card {
        padding: 10px;
    }

    .foto,
    .placeholder {

        height: 180px;
    }

    .card h3 {

        font-size: 14px;
    }

    .preco {

        font-size: 17px;
    }
}

</style>

<script>


/* =========================

const WHATSAPP =

/* =========================

const produtos = [

    },


    {
        id: 8,

        preco: 60,

        fotos: []
    },


    {
        id: 9,

        nome:
            "Camisa Real Madrid 26/27 - Principal",

        preco: 60,

    },


    {
        id: 10,

        nome:
            "Camisa São Paulo 2026 - Principal",

    }

];



/* =========================
   CARRINHO
========================= */

let carrinho = [];



/* =========================
   MOSTRAR PRODUTOS
========================= */

function mostrarProdutos() {


    const container =
        document.getElementById("produtos");


    container.innerHTML = "";


    produtos.forEach(produto => {


        const card =
            document.createElement("div");


        card.className = "card";


        /* FOTOS */

        const fotos =
            document.createElement("div");


        fotos.className = "fotos";


        if (produto.fotos.length > 0) {


            produto.fotos.forEach(
                (foto, index) => {


                const img =
                    document.createElement("img");


                img.src = foto;

                img.className = "foto";

                img.alt = produto.nome;


                img.addEventListener(
                    "click",
                    () => {

                        abrirModal(
                            produto.id,
                            index
                        );

                    }
                );


                fotos.appendChild(img);

            });


        } else {


            const placeholder =
                document.createElement("div");


            placeholder.className =
                "placeholder";


            placeholder.innerHTML =
                "ESPAÇO PARA<br>FOTO DA CAMISA";


            fotos.appendChild(
                placeholder
            );

        }



        /* TÍTULO */

        const titulo =
            document.createElement("h3");


        titulo.textContent =
            produto.nome;



        /* PREÇO */

        const preco =
            document.createElement("div");


        preco.className =
            "preco";


        preco.textContent =
            "R$ " +
            produto.preco
                .toFixed(2)
                .replace(".", ",");



        /* TAMANHO */

        const select =
            document.createElement("select");


        select.innerHTML = `

            <option value="">
                Escolha o tamanho
            </option>

            <option value="P">
                P
            </option>

            <option value="M">
                M
            </option>

            <option value="G">
                G
            </option>

            <option value="GG">
                GG
            </option>

        `;



        /* BOTÃO */

        const button =
            document.createElement("button");


        button.className =
            "add-cart";


        button.textContent =
            "Adicionar ao carrinho";


        button.addEventListener(
            "click",
            () => {


                if (!select.value) {

                    alert(
                        "Escolha um tamanho."
                    );

                    return;
                }


                adicionarCarrinho(
                    produto,
                    select.value
                );

            }
        );



        card.appendChild(fotos);

        card.appendChild(titulo);

        card.appendChild(preco);

        card.appendChild(select);

        card.appendChild(button);


        container.appendChild(card);

    });

}



/* =========================
   ADICIONAR CARRINHO
========================= */

function adicionarCarrinho(
    produto,
    tamanho
) {


    const existente =
        carrinho.find(
            item =>
                item.id === produto.id &&
                item.tamanho === tamanho
        );


    if (existente) {

        existente.quantidade++;

    } else {


        carrinho.push({

            id: produto.id,

            nome: produto.nome,

            preco: produto.preco,

            tamanho: tamanho,

            quantidade: 1

        });

    }


    atualizarCarrinho();


    alert(
        "Camisa adicionada ao carrinho."
    );

}



/* =========================
   ATUALIZAR CARRINHO
========================= */

function atualizarCarrinho() {


    const container =
        document.getElementById(
            "cartItems"
        );


    const counter =
        document.getElementById(
            "cartCounter"
        );


    const totalElement =
        document.getElementById(
            "cartTotal"
        );


    container.innerHTML = "";


    let total = 0;

    let quantidadeTotal = 0;



    carrinho.forEach(
        (item, index) => {


        total +=
            item.preco *
            item.quantidade;


        quantidadeTotal +=
            item.quantidade;



        /* CONTAINER */

        const swipeContainer =
            document.createElement(
                "div"
            );


        swipeContainer.className =
            "swipe-container";



        /* LIXEIRA */

        const lixeira =
            document.createElement(
                "div"
            );


        lixeira.className =
            "lixeira";


        lixeira.innerHTML =
            "🗑";



        /* ITEM */

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "cart-item swipe-item";



        div.innerHTML = `

            <h3>
                ${item.nome}
            </h3>

            <p>
                Tamanho: ${item.tamanho}
            </p>

            <p>
                R$ ${item.preco
                    .toFixed(2)
                    .replace(".", ",")}
            </p>

            <div class="quantidade">

                <button
                    data-index="${index}"
                    data-action="menos">

                    -

                </button>


                <span>
                    ${item.quantidade}
                </span>


                <button
                    data-index="${index}"
                    data-action="mais">

                    +

                </button>

            </div>

        `;



        /* BOTÕES + E - */

        div.querySelectorAll(
            "button"
        ).forEach(button => {


            button.addEventListener(
                "click",
                () => {


                    const i =
                        Number(
                            button.dataset.index
                        );


                    const action =
                        button.dataset.action;



                    if (
                        action === "mais"
                    ) {

                        carrinho[i]
                            .quantidade++;

                    }



                    if (
                        action === "menos"
                    ) {


                        carrinho[i]
                            .quantidade--;


                        if (
                            carrinho[i]
                                .quantidade <= 0
                        ) {

                            carrinho.splice(
                                i,
                                1
                            );

                        }

                    }


                    atualizarCarrinho();

                }
            );

        });



        /* =========================
           LIXEIRA
        ========================= */

        lixeira.addEventListener(
            "click",
            () => {


                carrinho.splice(
                    index,
                    1
                );


                atualizarCarrinho();

            }
        );



        /* =========================
           ARRASTAR NO CELULAR
        ========================= */

        let inicioX = 0;

        let movimentoX = 0;

        let arrastando = false;



        div.addEventListener(
            "touchstart",
            (e) => {


                inicioX =
                    e.touches[0]
                        .clientX;


                arrastando = true;


                div.style.transition =
                    "none";

            }
        );



        div.addEventListener(
            "touchmove",
            (e) => {


                if (!arrastando)
                    return;


                movimentoX =
                    e.touches[0]
                        .clientX -
                    inicioX;



                /* SÓ ESQUERDA */

                if (
                    movimentoX < 0
                ) {


                    const limite =
                        Math.max(
                            movimentoX,
                            -80
                        );


                    div.style.transform =
                        `translateX(${limite}px)`;

                }

            }
        );



        div.addEventListener(
            "touchend",
            () => {


                arrastando = false;


                div.style.transition =
                    "transform 0.25s ease";



                if (
                    movimentoX < -40
                ) {


                    div.style.transform =
                        "translateX(-80px)";


                } else {


                    div.style.transform =
                        "translateX(0)";

                }


                inicioX = 0;

                movimentoX = 0;

            }
        );



        swipeContainer.appendChild(
            lixeira
        );


        swipeContainer.appendChild(
            div
        );


        container.appendChild(
            swipeContainer
        );

    });



    counter.textContent =
        quantidadeTotal;


    totalElement.textContent =
        total
            .toFixed(2)
            .replace(".", ",");

}



/* =========================
   MODAL
========================= */

let produtoModal = null;

let fotoAtual = 0;



function abrirModal(
    id,
    index
) {


    const produto =
        produtos.find(
            p => p.id === id
        );


    if (
        !produto ||
        produto.fotos.length === 0
    ) {

        return;

    }


    produtoModal =
        produto;


    fotoAtual =
        index;


    atualizarImagemModal();


    document.getElementById(
        "modal"
    ).style.display =
        "flex";

}



function atualizarImagemModal() {


    document.getElementById(
        "imagemModal"
    ).src =
        produtoModal.fotos[
            fotoAtual
        ];

}



function fecharModal() {


    document.getElementById(
        "modal"
    ).style.display =
        "none";

}



function fotoAnterior() {


    if (!produtoModal)
        return;


    fotoAtual--;


    if (
        fotoAtual < 0
    ) {

        fotoAtual =
            produtoModal.fotos.length - 1;

    }


    atualizarImagemModal();

}



function proximaFoto() {


    if (!produtoModal)
        return;


    fotoAtual++;


    if (
        fotoAtual >=
        produtoModal.fotos.length
    ) {

        fotoAtual = 0;

    }


    atualizarImagemModal();

}

            carrinho.length === 0
        ) {


            alert(
                "O carrinho já está vazio."
            );


            return;

        }



        const confirmar =
            confirm(
                "Tem certeza que deseja excluir todos os itens do carrinho?"
            );



        if (!confirmar) {

            return;

        }



        carrinho = [];


        atualizarCarrinho();

    }
);



/* =========================
   FINALIZAR PEDIDO
========================= */

document.getElementById(
    "finalizarWhatsApp"
).addEventListener(
    "click",
    () => {


        if (
            carrinho.length === 0
        ) {


            alert(
                "Seu carrinho está vazio."
            );


            return;

        }



        const nome =
            document.getElementById(
                "nome"
            ).value.trim();



        const bairro =
            document.getElementById(
                "bairro"
            ).value.trim();



        const rua =
            document.getElementById(
                "rua"
            ).value.trim();



        const numero =
            document.getElementById(
                "numero"
            ).value.trim();



        if (
            !nome ||
            !bairro ||
            !rua ||
            !numero
        ) {


            alert(
                "Preencha todos os dados de entrega."
            );


            return;

        }



        let mensagem =
            "Olá! Gostaria de fazer um pedido na MC SPORTS.\n\n";



        carrinho.forEach(
            item => {


            mensagem +=

                item.nome +

                " | Tamanho: " +

                item.tamanho +

                " | Quantidade: " +

                item.quantidade +

                " | R$ " +

                (
                    item.preco *
                    item.quantidade
                )
                .toFixed(2)
                .replace(".", ",") +

                "\n";

        });



        const total =
            carrinho.reduce(
                (soma, item) =>
                    soma +
                    item.preco *
                    item.quantidade,

                0
            );



        mensagem +=

            "\nTotal: R$ " +

            total
                .toFixed(2)
                .replace(".", ",");



        mensagem +=

            "\n\nDados de entrega:" +

            "\nNome: " +
            nome +

            "\nBairro: " +
            bairro +

            "\nRua: " +
            rua +

            "\nNúmero da casa: " +
            numero;



        const url =

            "https://wa.me/" +

            WHATSAPP +

            "?text=" +

            encodeURIComponent(
                mensagem
            );



        window.open(
            url,
            "_blank"
        );

    }
);

    "modal"

    "click",
    (e) => {


        if (
            e.target.id ===
            "modal"
        ) {

            fecharModal();

        }

    }
);



/* TECLADO */

document.addEventListener(
    "keydown",
    (e) => {


        const modal =
            document.getElementById(
                "modal"
            );


        if (
            modal.style.display !==
            "flex"
        ) {

            return;

        }


        if (
            e.key === "Escape"
        ) {

            fecharModal();

        }


        if (
            e.key === "ArrowLeft"
        ) {

            fotoAnterior();

        }


        if (
            e.key === "ArrowRight"
        ) {

            proximaFoto();

        }

    }
);
