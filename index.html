<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Sports</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#7a1230;
    color:#111;
}

/* TOPO */

header{
    background:#004d98;
    color:white;
    padding:16px 18px;
    position:sticky;
    top:0;
    z-index:10;
}

.topo{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo-topo{
    font-size:26px;
    font-weight:900;
    font-style:italic;
    letter-spacing:-1px;
}

.slogan{
    color:#dcecff;
    font-size:12px;
    margin-top:2px;
}

.carrinho-btn{
    background:white;
    color:#004d98;
    border:0;
    width:45px;
    height:45px;
    border-radius:50%;
    font-size:21px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 10px #0003;
}

/* TELA INICIAL */

.inicio{
    min-height:calc(100vh - 77px);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px 20px;
    background:
    linear-gradient(135deg,#004d98 0%,#004d98 42%,#7a1230 42%,#7a1230 100%);
}

.logo-principal{
    width:145px;
    height:145px;
    margin:0 auto 25px;
    border-radius:50%;
    background:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    box-shadow:0 10px 35px #0005;
    border:8px solid #7a1230;
}

.logo-principal .bola{
    font-size:43px;
    line-height:1;
}

.logo-principal strong{
    font-size:20px;
    font-style:italic;
    color:#004d98;
    letter-spacing:-1px;
}

.logo-principal span{
    font-size:8px;
    font-weight:bold;
    color:#7a1230;
    letter-spacing:2px;
}

.inicio h1{
    color:white;
    font-size:52px;
    font-weight:900;
    font-style:italic;
    letter-spacing:-3px;
    text-shadow:3px 4px 0 #7a1230;
}

.inicio p{
    color:#eee;
    font-size:17px;
    margin:8px 0 28px;
}

.botoes-inicio{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:min(300px,100%);
    margin:auto;
}

.botao-camisas,
.botao-whatsapp{
    border:0;
    padding:15px 20px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.botao-camisas{
    background:white;
    color:#004d98;
}

.botao-whatsapp{
    background:#25D366;
    color:white;
}

/* PRODUTOS */

.produtos-area{
    background:#7a1230;
    padding:40px 0 50px;
}

.titulo-produtos{
    color:white;
    text-align:center;
    font-size:30px;
    margin-bottom:25px;
    font-weight:900;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:0 18px;
}

.produtos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:24px;
}

.produto{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 5px 18px #0003;
    transition:transform .2s,box-shadow .2s;
}

.produto:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 24px #0004;
}

.galeria{
    position:relative;
    height:340px;
    background:#eee;
    overflow:hidden;
}

.galeria img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.galeria img.ativa{
    display:block;
}

.seta{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#ffffffdd;
    color:#000;
    font-size:22px;
    cursor:pointer;
    z-index:2;
    box-shadow:0 2px 8px #0002;
}

.esquerda{
    left:10px;
}

.direita{
    right:10px;
}

.sem-foto{
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#777;
    font-weight:bold;
}

.info{
    padding:18px;
}

.info h2{
    font-size:19px;
    line-height:1.3;
    margin-bottom:8px;
}

.tamanho{
    color:#777;
    font-size:14px;
    margin:6px 0;
}

.preco{
    font-size:24px;
    font-weight:bold;
    margin:14px 0;
}

.adicionar{
    width:100%;
    padding:14px;
    background:#004d98;
    color:white;
    border:0;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

.adicionar:hover{
    background:#003b75;
}

/* CARRINHO */

.carrinho{
    position:fixed;
    right:0;
    top:0;
    width:min(420px,100%);
    height:100%;
    background:white;
    z-index:20;
    padding:22px;
    overflow-y:auto;
    box-shadow:-5px 0 20px #0003;
    display:none;
}

.carrinho.aberto{
    display:block;
}

.fechar{
    float:right;
    border:0;
    background:#eee;
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
}

.item{
    padding:16px 0;
    border-bottom:1px solid #eee;
}

.item-produto{
    display:flex;
    gap:12px;
    align-items:center;
}

.item-produto img{
    width:75px;
    height:75px;
    object-fit:cover;
    border-radius:8px;
    background:#eee;
}

.item-info{
    flex:1;
}

.quantidade{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
}

.quantidade button{
    width:30px;
    height:30px;
    border:1px solid #ddd;
    background:white;
    border-radius:5px;
}

.total{
    font-size:22px;
    font-weight:bold;
    margin:25px 0;
}

.whatsapp{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#25D366;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.continuar{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    background:white;
    color:#111;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.vazio{
    text-align:center;
    color:#777;
    margin-top:40px;
}

footer{
    text-align:center;
    padding:35px 20px;
    background:#050505;
    color:#aaa;
}

/* CELULAR */

@media(max-width:500px){

    .inicio h1{
        font-size:43px;
    }

    .logo-principal{
        width:130px;
        height:130px;
    }

    .produtos{
        grid-template-columns:1fr 1fr;
        gap:12px;
    }

    .galeria{
        height:260px;
    }

    .info{
        padding:13px;
    }

    .info h2{
        font-size:16px;
    }

    .preco{
        font-size:20px;
    }

    .adicionar{
        padding:11px;
        font-size:13px;
    }

}

</style>
</head>

<body>

<header>

<div class="topo">

<div>
<div class="logo-topo">MC SPORTS</div>
<div class="slogan">A loja do seu time</div>
</div>

<button class="carrinho-btn" onclick="abrirCarrinho()" aria-label="Carrinho">
🛒
</button>

</div>

</header>


<section class="inicio">

<div>

<div class="logo-principal">

<div class="bola">⚽</div>

<strong>MC</strong>

<span>SPORTS</span>

</div>

<h1>MC SPORTS</h1>

<p>A loja do seu time</p>

<div class="botoes-inicio">

<button class="botao-camisas" onclick="irParaProdutos()">
Ver camisas
</button>

<button class="botao-whatsapp" onclick="abrirWhatsApp()">
WhatsApp — Dúvidas
</button>

</div>

</div>

</section>


<section class="produtos-area" id="produtos-section">

<h2 class="titulo-produtos">
Nossas camisas
</h2>

<main class="container">

<div class="produtos" id="produtos"></div>

</main>

</section>


<div class="carrinho" id="carrinho">

<button class="fechar" onclick="fecharCarrinho()">
Fechar
</button>

<h2>Seu carrinho</h2>

<div id="itens"></div>

<div class="total">
Total: R$ <span id="total">0,00</span>
</div>

<button class="whatsapp" onclick="finalizarPedido()">
Finalizar pedido pelo WhatsApp
</button>

<button class="continuar" onclick="fecharCarrinho()">
Continuar comprando
</button>

</div>


<footer>

MC Sports — A loja do seu time

</footer>


<script>

const numeroWhatsApp = "5592994486162";


const produtos = [

{
id:1,
time:"Chelsea",
nome:"Camisa Chelsea 26/27 — Principal",
tamanho:"G",
preco:60,
fotos:[
"chelsea2.jpg.heic",
"chelsea.jpg.heic",
"chelsea3.jpg.heic",
"chelsea4.jpg.heic"
]
},

{
id:2,
time:"Corinthians",
nome:"Camisa Corinthians 2026 — Torcedor",
tamanho:"M",
preco:60,
fotos:[
"Corinthians.jpg.heic",
"Corinthians2.jpg.heic"
]
},

{
id:3,
time:"Flamengo",
nome:"Camisa Flamengo 2026 — Principal",
tamanho:"M",
preco:60,
fotos:[
"Flamengo.jpg.heic",
"Flamengo2.jpg.heic"
]
},

{
id:4,
time:"Milan",
nome:"Camisa Milan 26/27 — Principal",
tamanho:"M",
preco:60,
fotos:[
"Milan.jpg.heic",
"Milan2.jpg.heic"
]
}

];


let carrinho=[];


function dinheiro(valor){

return valor.toLocaleString("pt-BR",{
minimumFractionDigits:2
});

}


function irParaProdutos(){

document
.getElementById("produtos-section")
.scrollIntoView({
behavior:"smooth"
});

}


function abrirWhatsApp(){

const mensagem=
"Olá! Estou no site da MC Sports e gostaria de tirar uma dúvida.";

window.open(
"https://wa.me/"+
numeroWhatsApp+
"?text="+
encodeURIComponent(mensagem),
"_blank"
);

}


function mostrarProdutos(){

const area=document.getElementById("produtos");

area.innerHTML="";

produtos.forEach(produto=>{

let galeria="";


if(produto.fotos.length>0){

galeria=`

<div class="galeria">

${produto.fotos.map((foto,index)=>`

<img
src="${foto}"
class="${index===0 ? "ativa" : ""}"
alt="${produto.nome}"
>

`).join("")}


${produto.fotos.length>1 ? `

<button
class="seta esquerda"
onclick="mudarFoto(this,-1)">
‹
</button>

<button
class="seta direita"
onclick="mudarFoto(this,1)">
›
</button>

` : ""}

</div>

`;

}else{

galeria=`

<div class="galeria">

<div class="sem-foto">
FOTO DA CAMISA
</div>

</div>

`;

}


area.innerHTML+=`

<div class="produto">

${galeria}

<div class="info">

<h2>${produto.nome}</h2>

<div class="tamanho">
Tamanho disponível:
<strong>${produto.tamanho}</strong>
</div>

<div class="preco">
R$ ${dinheiro(produto.preco)}
</div>

<button
class="adicionar"
onclick="adicionar(${produto.id})">

Adicionar ao carrinho

</button>

</div>

</div>

`;

});

}


function mudarFoto(botao,direcao){

const galeria=botao.parentElement;

const fotos=galeria.querySelectorAll("img");

let atual=0;

fotos.forEach((foto,index)=>{

if(foto.classList.contains("ativa")){
atual=index;
}

});

fotos[atual].classList.remove("ativa");

let nova=atual+direcao;

if(nova<0){
nova=fotos.length-1;
}

if(nova>=fotos.length){
nova=0;
}

fotos[nova].classList.add("ativa");

}


function adicionar(id){

const existente=
carrinho.find(item=>item.id===id);

if(existente){

existente.quantidade++;

}else{

carrinho.push({
id:id,
quantidade:1
});

}

atualizarCarrinho();

abrirCarrinho();

}


function atualizarCarrinho(){

const area=document.getElementById("itens");

area.innerHTML="";

let total=0;
let quantidadeTotal=0;


if(carrinho.length===0){

area.innerHTML=
'<div class="vazio">Seu carrinho está vazio.</div>';

}


carrinho.forEach(item=>{

const produto=
produtos.find(p=>p.id===item.id);

const subtotal=
produto.preco*item.quantidade;

total+=subtotal;

quantidadeTotal+=item.quantidade;


area.innerHTML+=`

<div class="item">

<div class="item-produto">

<img
src="${produto.fotos[0]}"
alt="${produto.nome}"
>

<div class="item-info">

<strong>
${produto.nome}
</strong>

<br>

<small>
Tamanho ${produto.tamanho}
</small>

<div class="quantidade">

<button onclick="alterarQuantidade(${item.id},-1)">
-
</button>

<span>
${item.quantidade}
</span>

<button onclick="alterarQuantidade(${item.id},1)">
+
</button>

<span>
R$ ${dinheiro(subtotal)}
</span>

</div>

</div>

</div>

</div>

`;

});


document.getElementById("total").innerText=
dinheiro(total);

document.getElementById("contador").innerText=
quantidadeTotal;

}


function alterarQuantidade(id,valor){

const item=
carrinho.find(i=>i.id===id);

if(!item)return;

item.quantidade+=valor;


if(item.quantidade<=0){

carrinho=
carrinho.filter(i=>i.id!==id);

}


atualizarCarrinho();

}


function abrirCarrinho(){

document
.getElementById("carrinho")
.classList.add("aberto");

}


function fecharCarrinho(){

document
.getElementById("carrinho")
.classList.remove("aberto");

}


function finalizarPedido(){

if(carrinho.length===0){

alert("Seu carrinho está vazio.");

return;

}


let mensagem=
"Olá! Quero fazer um pedido na MC Sports:%0A%0A";

let total=0;


carrinho.forEach(item=>{

const produto=
produtos.find(p=>p.id===item.id);

const subtotal=
produto.preco*item.quantidade;

total+=subtotal;


mensagem+=
`${item.quantidade}x ${produto.nome} - Tamanho ${produto.tamanho} - R$ ${dinheiro(subtotal)}%0A`;

});


mensagem+=
`%0ATotal: R$ ${dinheiro(total)}%0A%0A`;

mensagem+=
"Gostaria de confirmar a disponibilidade e combinar a entrega.";


window.open(
"https://wa.me/"+
numeroWhatsApp+
"?text="+
mensagem,
"_blank"
);

}


mostrarProdutos();

atualizarCarrinho();

</script>

</body>
</html>
